<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개발용 · 첫 화면 등장 효과 비교</title>
<style>
  body { margin: 0; padding: 20px; font: 14px/1.5 system-ui, sans-serif; background: #e9e4da; color: #1f2b4d; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  p { margin: 0 0 16px; color: #5a6275; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  button, select { font: inherit; padding: 8px 14px; border-radius: 10px; border: 1px solid #c9c2b4; background: #fff; cursor: pointer; }
  button.pri { background: #d63a1f; color: #fff; border-color: #d63a1f; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  figure { margin: 0; }
  figcaption { margin-bottom: 8px; font-weight: 700; }
  iframe { width: 390px; height: 844px; border: 0; border-radius: 28px; box-shadow: 0 20px 50px rgba(20, 30, 60, .25); background: #fff; }
</style>
</head>
<body>
<h1>첫 화면 등장 효과 비교 (개발용)</h1>
<p>앱 화면에는 나오지 않는 페이지예요. 같은 크기(390×844)로 두 방식을 나란히 열어요. 실제 앱의 방식은 <code>js/config.js</code> 의 <code>INTRO_MODE</code> 로 정해요.</p>
<div class="bar">
  <button class="pri" id="both">둘 다 다시 보기</button>
  <button data-f="a">A만 다시</button>
  <button data-f="b">B만 다시</button>
</div>
<div class="row">
  <figure><figcaption>A · fold3d (3면 펼침)</figcaption><iframe id="a" title="A fold3d"></iframe></figure>
  <figure><figcaption>B · soft (부드럽게)</figcaption><iframe id="b" title="B soft"></iframe></figure>
</div>
<script>
  const src = { a: '../index.html?intro=fold3d', b: '../index.html?intro=soft' };
  const go = k => {
    const f = document.getElementById(k);
    f.src = src[k] + '&t=' + Date.now();
  };
  document.getElementById('both').onclick = () => { go('a'); go('b'); };
  document.querySelectorAll('[data-f]').forEach(b => (b.onclick = () => go(b.dataset.f)));
  go('a'); go('b');
</script>
</body>
</html>
